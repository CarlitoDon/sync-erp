name: Staging API Rollback Drill

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the API deployment lock so a drill cannot race a normal staging
# deployment against the same retained-release metadata and PM2 process.
concurrency:
  group: hostinger-dev
  cancel-in-progress: false

jobs:
  rollback_drill:
    name: Failure-injected staging rollback
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
    steps:
      - name: Enforce staging-only ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" && "$GITHUB_REF" != refs/heads/codex/* ]]; then
            echo "This workflow only accepts manual dispatch from refs/heads/dev or codex branches; production is not a valid target." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build API
        run: npm run build:api

      - name: Prepare and validate drill artifact
        id: package
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf deploy/api-mcp
          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database deploy/api-mcp/prisma
          cp -R apps/api/dist deploy/api-mcp/
          cp apps/api/package.pro.json deploy/api-mcp/package.json
          cp packages/database/prisma/schema.prisma deploy/api-mcp/prisma/
          cp packages/database/prisma.config.ts deploy/api-mcp/prisma.config.ts
          cp -R packages/database/prisma/migrations deploy/api-mcp/prisma/

          npm install \
            --prefix deploy/api-mcp \
            --omit=dev \
            --no-audit \
            --no-fund \
            --legacy-peer-deps

          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database
          cp -R packages/database/dist deploy/api-mcp/node_modules/@sync-erp/database/
          cp packages/database/package.json deploy/api-mcp/node_modules/@sync-erp/database/
          if [[ -d packages/database/src/generated ]]; then
            cp -R packages/database/src/generated deploy/api-mcp/node_modules/@sync-erp/database/
          fi

          release_version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("apps/api/package.json", "utf8")).version)')"
          node scripts/write-release-manifest.mjs \
            --output deploy/api-mcp/release.json \
            --service sync-erp-api \
            --commit "$RELEASE_SHA" \
            --version "$release_version" \
            --repository "$RELEASE_REPOSITORY" \
            --ref "$RELEASE_REF" \
            --run-id "$RELEASE_RUN_ID"
          node scripts/validate-api-artifact.mjs \
            --artifact-dir deploy/api-mcp \
            --expected-sha "$RELEASE_SHA"
          cp scripts/verify-release-health.mjs deploy/api-mcp/verify-release-health.mjs

          archive="$RUNNER_TEMP/sync-erp-api-rollback-drill-${GITHUB_RUN_ID}.tar.gz"
          tar -C deploy/api-mcp -czf "$archive" .
          artifact_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "artifact=$archive" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "Drill artifact SHA-256: $artifact_sha256"

      - name: Upload drill artifact for retention
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-rollback-drill-${{ github.run_id }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

      - name: Execute failure-injected release and rollback
        id: rollback
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SYNC_ERP_AUTH_STATE_SECRET: ${{ secrets.SYNC_ERP_AUTH_STATE_SECRET }}
          API_ARCHIVE: ${{ steps.package.outputs.artifact }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          : "${ARTIFACT_SHA256:?Missing local drill artifact digest.}"
          echo "Transferring validated drill artifact with SHA-256 ${ARTIFACT_SHA256}."

          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 "$HOSTINGER_HOST" > ~/.ssh/known_hosts 2>/dev/null || true

          eval "$(ssh-agent -a "$SSH_AUTH_SOCK")"
          echo 'echo "$SSH_PASSPHRASE"' > ~/.ssh/askpass
          chmod +x ~/.ssh/askpass
          export SSH_ASKPASS=~/.ssh/askpass
          export DISPLAY=:0
          ssh-add ~/.ssh/id_ed25519

          SSH_COMMON_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o ConnectionAttempts=5 -o BatchMode=yes"
          SSH_OPTS="-p 65002 ${SSH_COMMON_OPTS}"
          SCP_OPTS="-P 65002 ${SSH_COMMON_OPTS}"
          runtime_env_file="$RUNNER_TEMP/sync-erp-runtime-rollback-drill-${GITHUB_RUN_ID}.env"
          remote_archive="sync-erp-api-rollback-drill-${GITHUB_RUN_ID}.tar.gz"
          remote_runtime_env="sync-erp-runtime-rollback-drill-${GITHUB_RUN_ID}.env"
          trap 'rm -f "$runtime_env_file"' EXIT

          for secret_name in \
            GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET \
            SYNC_ERP_AUTH_STATE_SECRET \
            DATABASE_URL; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required staging secret ${secret_name}." >&2
              exit 1
            fi
          done

          case "$DATABASE_URL" in
            *"postgres.ctesbnhcqubamrtcxxqi:"*|*"@db.ctesbnhcqubamrtcxxqi.supabase.co"*) ;;
            *)
              echo "DATABASE_URL does not match the staging Supabase project." >&2
              exit 1
              ;;
          esac

          {
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$(printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" | base64 | tr -d '\n')"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$(printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | base64 | tr -d '\n')"
            printf 'SYNC_ERP_AUTH_STATE_SECRET=%s\n' "$(printf '%s' "$SYNC_ERP_AUTH_STATE_SECRET" | base64 | tr -d '\n')"
            printf 'DATABASE_URL=%s\n' "$(printf '%s' "$DATABASE_URL" | base64 | tr -d '\n')"
          } > "$runtime_env_file"
          chmod 600 "$runtime_env_file"

          timeout 900 scp ${SCP_OPTS} \
            "$API_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${remote_archive}"
          timeout 900 scp ${SCP_OPTS} \
            "$runtime_env_file" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${remote_runtime_env}"

          rollback_output="$(
            ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
              "DEPLOY_DIR='apps/api-staging' REMOTE_API_ARCHIVE='${remote_archive}' REMOTE_RUNTIME_ENV='${remote_runtime_env}' PM2_NAME='sync-erp-api-staging' APP_PORT='3001' RUNTIME_ENV='staging' DATABASE_PROJECT_REF='ctesbnhcqubamrtcxxqi' EXPECTED_SHA='${GITHUB_SHA}' ROLLBACK_DRILL_CONFIRMATION='ROLLBACK_STAGING' DRILL_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' API_URL='https://api-staging.santiliving.com/api/trpc' API_BASE_URL='https://api-staging.santiliving.com' WEB_URL='https://sync-erp-staging.santiliving.com' OAUTH_REDIRECT_URL='https://api-staging.santiliving.com/api/auth/google/callback' CORS_ORIGINS='http://localhost:5173,https://sync-erp-staging.santiliving.com,https://sync-erp-git-dev-doncarlo31s-projects.vercel.app' PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH bash -s -- rollback-drill" < scripts/hostinger-api-release.sh
          )"
          printf '%s\n' "$rollback_output"

          read_marker() {
            local marker="$1"
            printf '%s\n' "$rollback_output" | sed -n "s/^${marker}=//p" | tail -n 1
          }

          result="$(read_marker ROLLBACK_DRILL_RESULT)"
          migrations="$(read_marker ROLLBACK_DRILL_MIGRATIONS)"
          new_sha="$(read_marker ROLLBACK_DRILL_NEW_SHA)"
          attempt_path="$(read_marker ROLLBACK_DRILL_ATTEMPT_PATH)"
          previous_sha="$(read_marker ROLLBACK_DRILL_PREVIOUS_SHA)"
          previous_version="$(read_marker ROLLBACK_DRILL_PREVIOUS_VERSION)"
          previous_release="$(read_marker ROLLBACK_DRILL_PREVIOUS_RELEASE)"
          previous_pm2="$(read_marker ROLLBACK_DRILL_PREVIOUS_PM2)"
          previous_port="$(read_marker ROLLBACK_DRILL_PREVIOUS_PORT)"
          previous_pid="$(read_marker ROLLBACK_DRILL_PREVIOUS_PID)"

          [[ "$result" == success ]]
          [[ "$migrations" == skipped ]]
          [[ "$new_sha" == "$GITHUB_SHA" ]]
          [[ "$previous_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$attempt_path" == */releases/.rollback-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} ]]
          [[ "$previous_release" == */apps/api-staging/releases/* || "$previous_release" == */apps/api-staging ]]
          [[ "$previous_pm2" == sync-erp-api-staging ]]
          [[ "$previous_port" == 3001 ]]
          [[ "$previous_pid" =~ ^[0-9]+$ && "$previous_pid" != 0 ]]

          echo "artifact_sha256=${ARTIFACT_SHA256}"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          echo "attempt_path=${attempt_path}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"
          echo "previous_release=${previous_release}" >> "$GITHUB_OUTPUT"
          echo "previous_pm2=${previous_pm2}" >> "$GITHUB_OUTPUT"
          echo "previous_port=${previous_port}" >> "$GITHUB_OUTPUT"
          echo "previous_pid=${previous_pid}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${ARTIFACT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Verify restored release identity and health externally
        env:
          HEALTH_HOST: https://api-staging.santiliving.com
          PREVIOUS_SHA: ${{ steps.rollback.outputs.previous_sha }}
        run: |
          set -euo pipefail
          for path in /health /mcp/health; do
            verified=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if node scripts/verify-release-health.mjs \
                --url "${HEALTH_HOST}${path}" \
                --expected-sha "$PREVIOUS_SHA"; then
                echo "Restored release ${PREVIOUS_SHA} is externally healthy at ${path} (attempt ${attempt}/8)."
                verified=1
                break
              fi
              if [[ "$attempt" -lt 8 ]]; then
                sleep 10
              fi
            done
            if [[ "$verified" -ne 1 ]]; then
              echo "Restored release ${PREVIOUS_SHA} failed external health verification at ${path}." >&2
              exit 1
            fi
          done

          echo "Staging rollback drill completed: previous release ${PREVIOUS_SHA} and release identity were restored; migrations were skipped."
