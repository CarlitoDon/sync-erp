name: Staging API Rollback Drill

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the API deployment lock so a drill cannot race a normal staging
# deployment against the same retained-release metadata and PM2 process.
concurrency:
  group: hostinger-dev
  cancel-in-progress: false

jobs:
  rollback_drill:
    name: Failure-injected staging rollback
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
    steps:
      - name: Enforce staging-only ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/dev" && "$GITHUB_REF" != refs/heads/codex/* ]]; then
            echo "This workflow only accepts manual dispatch from refs/heads/dev or codex branches; production is not a valid target." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build API
        run: npm run build:api

      - name: Prepare and validate drill artifact
        id: package
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf deploy/api-mcp
          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database deploy/api-mcp/prisma
          cp -R apps/api/dist deploy/api-mcp/
          cp apps/api/package.pro.json deploy/api-mcp/package.json
          cp packages/database/prisma/schema.prisma deploy/api-mcp/prisma/
          cp packages/database/prisma.config.ts deploy/api-mcp/prisma.config.ts
          cp -R packages/database/prisma/migrations deploy/api-mcp/prisma/

          npm install \
            --prefix deploy/api-mcp \
            --omit=dev \
            --no-audit \
            --no-fund \
            --legacy-peer-deps

          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database
          cp -R packages/database/dist deploy/api-mcp/node_modules/@sync-erp/database/
          cp packages/database/package.json deploy/api-mcp/node_modules/@sync-erp/database/
          if [[ -d packages/database/src/generated ]]; then
            cp -R packages/database/src/generated deploy/api-mcp/node_modules/@sync-erp/database/
          fi

          release_version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("apps/api/package.json", "utf8")).version)')"
          node scripts/write-release-manifest.mjs \
            --output deploy/api-mcp/release.json \
            --service sync-erp-api \
            --commit "$RELEASE_SHA" \
            --version "$release_version" \
            --repository "$RELEASE_REPOSITORY" \
            --ref "$RELEASE_REF" \
            --run-id "$RELEASE_RUN_ID"
          node scripts/validate-api-artifact.mjs \
            --artifact-dir deploy/api-mcp \
            --expected-sha "$RELEASE_SHA"
          cp scripts/verify-release-health.mjs deploy/api-mcp/verify-release-health.mjs

          archive="$RUNNER_TEMP/sync-erp-api-rollback-drill-${GITHUB_RUN_ID}.tar.gz"
          tar -C deploy/api-mcp -czf "$archive" .
          artifact_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          echo "artifact=$archive" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "Drill artifact SHA-256: $artifact_sha256"

      - name: Upload drill artifact for retention
        uses: actions/upload-artifact@v4
        with:
          name: staging-api-rollback-drill-${{ github.run_id }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 7

      - name: Pin Hostinger SSH host key
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOSTINGER_SSH_PORT: '65002'
        run: bash scripts/hostinger-ssh-pinning.sh

      - name: Execute failure-injected release and rollback
        id: rollback
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_PORT: '65002'
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SYNC_ERP_AUTH_STATE_SECRET: ${{ secrets.SYNC_ERP_AUTH_STATE_SECRET }}
          API_ARCHIVE: ${{ steps.package.outputs.artifact }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          : "${ARTIFACT_SHA256:?Missing local drill artifact digest.}"
          : "${HOSTINGER_KNOWN_HOSTS_FILE:?Missing Hostinger known-hosts file.}"
          : "${HOSTINGER_SSH_KEY:?Missing Hostinger SSH key.}"
          echo "Transferring validated drill artifact with SHA-256 ${ARTIFACT_SHA256}."

          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo 'RUNNER_TEMP must be an absolute directory.' >&2; exit 1 ;;
          esac
          case "$RUNNER_TEMP" in
            *[[:space:][:cntrl:]]*) echo 'RUNNER_TEMP contains whitespace or control characters.' >&2; exit 1 ;;
          esac
          if [ ! -d "$RUNNER_TEMP" ]; then
            echo 'RUNNER_TEMP must be an existing directory.' >&2
            exit 1
          fi
          RUNNER_TEMP_REAL="$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P)"
          case "$RUNNER_TEMP_REAL" in
            *[[:space:][:cntrl:]]*) echo 'resolved RUNNER_TEMP contains whitespace or control characters.' >&2; exit 1 ;;
          esac
          case "$HOSTINGER_KNOWN_HOSTS_FILE" in
            "$RUNNER_TEMP_REAL"/hostinger-known-hosts.*) ;;
            *) echo 'Hostinger known-hosts file is outside the validated RUNNER_TEMP.' >&2; exit 1 ;;
          esac
          if [ ! -f "$HOSTINGER_KNOWN_HOSTS_FILE" ] || [ -L "$HOSTINGER_KNOWN_HOSTS_FILE" ] || [ ! -r "$HOSTINGER_KNOWN_HOSTS_FILE" ]; then
            echo 'Hostinger known-hosts file must be a readable regular file.' >&2
            exit 1
          fi

          SSH_RUNTIME_DIR=""
          SSH_KEY_FILE=""
          SSH_KEY_STAGED_FILE=""
          SSH_ASKPASS_FILE=""
          SSH_ASKPASS_STAGED_FILE=""
          SSH_AGENT_SOCKET=""
          SSH_AGENT_PID=""
          SSH_AGENT_CREATED=0
          SSH_OPTS=()
          SCP_OPTS=()
          SSH_TARGET=""
          runtime_env_file=""
          REMOTE_API_ARCHIVE=""
          REMOTE_RUNTIME_ENV=""
          REMOTE_UPLOAD_CLEANUP_COMMAND=""
          REMOTE_UPLOADS_PRESENT=0
          cleanup_local() {
            local primary_status="$?"
            trap - EXIT
            if [ "$REMOTE_UPLOADS_PRESENT" -eq 1 ] && [ -n "$REMOTE_UPLOAD_CLEANUP_COMMAND" ]; then
              # Cleanup uses the same pinned SSH options even when deployment
              # failed before the following remote command could start.
              ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "$REMOTE_UPLOAD_CLEANUP_COMMAND" >/dev/null 2>&1 || true
            fi
            if [ "$SSH_AGENT_CREATED" -eq 1 ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            for local_file in "$runtime_env_file" "$SSH_KEY_STAGED_FILE" "$SSH_KEY_FILE" "$SSH_ASKPASS_STAGED_FILE" "$SSH_ASKPASS_FILE" "$SSH_AGENT_SOCKET"; do
              if [ -n "$local_file" ]; then
                rm -f -- "$local_file" || true
              fi
            done
            if [ -n "$SSH_RUNTIME_DIR" ]; then
              rmdir -- "$SSH_RUNTIME_DIR" >/dev/null 2>&1 || true
            fi
            exit "$primary_status"
          }
          trap cleanup_local EXIT

          SSH_RUNTIME_DIR="$(umask 077 && mktemp -d "$RUNNER_TEMP_REAL/sync-erp-hostinger-ssh.XXXXXXXXXX")"
          chmod 700 "$SSH_RUNTIME_DIR"
          case "$SSH_RUNTIME_DIR" in
            "$RUNNER_TEMP_REAL"/sync-erp-hostinger-ssh.*) ;;
            *) echo 'SSH runtime directory was created outside RUNNER_TEMP.' >&2; exit 1 ;;
          esac
          if [ ! -d "$SSH_RUNTIME_DIR" ] || [ -L "$SSH_RUNTIME_DIR" ]; then
            echo 'SSH runtime directory must be a fresh private directory.' >&2
            exit 1
          fi
          SSH_KEY_FILE="$SSH_RUNTIME_DIR/id_ed25519"
          SSH_KEY_STAGED_FILE="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/.id_ed25519.XXXXXXXXXX")"
          case "$SSH_KEY_STAGED_FILE" in
            "$SSH_RUNTIME_DIR"/.id_ed25519.*) ;;
            *) echo 'SSH key staging file was created outside the private runtime directory.' >&2; exit 1 ;;
          esac
          if [ ! -f "$SSH_KEY_STAGED_FILE" ] || [ -L "$SSH_KEY_STAGED_FILE" ] || [ -e "$SSH_KEY_FILE" ] || [ -L "$SSH_KEY_FILE" ]; then
            echo 'SSH key paths must be fresh regular files.' >&2
            exit 1
          fi
          if ! printf '%s\n' "$HOSTINGER_SSH_KEY" |
            bash scripts/hostinger-ssh-pinning.sh \
              --write-atomic-file "$SSH_KEY_STAGED_FILE" "$SSH_KEY_FILE" 600; then
            echo 'Could not write the Hostinger SSH key safely.' >&2
            exit 1
          fi
          if [ ! -f "$SSH_KEY_FILE" ] || [ -L "$SSH_KEY_FILE" ]; then
            echo 'SSH key file was not published as a regular file.' >&2
            exit 1
          fi
          SSH_KEY_STAGED_FILE=""

          SSH_ASKPASS_FILE="$SSH_RUNTIME_DIR/askpass"
          SSH_ASKPASS_STAGED_FILE="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/.askpass.XXXXXXXXXX")"
          case "$SSH_ASKPASS_STAGED_FILE" in
            "$SSH_RUNTIME_DIR"/.askpass.*) ;;
            *) echo 'SSH askpass staging file was created outside the private runtime directory.' >&2; exit 1 ;;
          esac
          if [ ! -f "$SSH_ASKPASS_STAGED_FILE" ] || [ -L "$SSH_ASKPASS_STAGED_FILE" ] || [ -e "$SSH_ASKPASS_FILE" ] || [ -L "$SSH_ASKPASS_FILE" ]; then
            echo 'SSH askpass paths must be fresh regular files.' >&2
            exit 1
          fi
          if ! printf '%s\n' 'printf "%s\\n" "$SSH_PASSPHRASE"' |
            bash scripts/hostinger-ssh-pinning.sh \
              --write-atomic-file "$SSH_ASKPASS_STAGED_FILE" "$SSH_ASKPASS_FILE" 700; then
            echo 'Could not write the SSH askpass helper safely.' >&2
            exit 1
          fi
          if [ ! -f "$SSH_ASKPASS_FILE" ] || [ -L "$SSH_ASKPASS_FILE" ]; then
            echo 'SSH askpass file was not published as a regular file.' >&2
            exit 1
          fi
          SSH_ASKPASS_STAGED_FILE=""
          SSH_AGENT_SOCKET="$SSH_RUNTIME_DIR/agent.sock"
          if [ -e "$SSH_AGENT_SOCKET" ] || [ -L "$SSH_AGENT_SOCKET" ]; then
            echo 'SSH agent socket path unexpectedly pre-existed.' >&2
            exit 1
          fi
          unset SSH_AUTH_SOCK SSH_AGENT_PID
          SSH_AGENT_OUTPUT=""
          if ! SSH_AGENT_OUTPUT="$(ssh-agent -a "$SSH_AGENT_SOCKET")"; then
            echo 'Could not create the SSH agent.' >&2
            exit 1
          fi
          if [ -z "$SSH_AGENT_OUTPUT" ] || ! eval "$SSH_AGENT_OUTPUT"; then
            echo 'Could not initialize the SSH agent.' >&2
            exit 1
          fi
          if [ "${SSH_AUTH_SOCK:-}" != "$SSH_AGENT_SOCKET" ] || [ ! -S "$SSH_AGENT_SOCKET" ]; then
            echo 'SSH agent did not create the expected socket.' >&2
            exit 1
          fi
          case "${SSH_AGENT_PID:-}" in
            ''|*[!0-9]*) echo 'SSH agent did not return a valid PID.' >&2; exit 1 ;;
          esac
          if [ "$SSH_AGENT_PID" -le 0 ] || ! kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
            echo 'SSH agent PID is not running.' >&2
            exit 1
          fi
          SSH_AGENT_CREATED=1
          export SSH_ASKPASS="$SSH_ASKPASS_FILE"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          ssh-add "$SSH_KEY_FILE"

          SSH_COMMON_OPTS=(
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${HOSTINGER_KNOWN_HOSTS_FILE}"
            -o GlobalKnownHostsFile=none
            -o HostKeyAlgorithms=ssh-ed25519
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o ConnectTimeout=30
            -o ConnectionAttempts=5
            -o BatchMode=yes
            -o ControlMaster=no
          )
          SSH_OPTS=(-p "$HOSTINGER_SSH_PORT" "${SSH_COMMON_OPTS[@]}")
          SCP_OPTS=(-P "$HOSTINGER_SSH_PORT" "${SSH_COMMON_OPTS[@]}")
          SSH_TARGET="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          runtime_env_file="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/runtime-env.XXXXXXXXXX")"
          REMOTE_API_ARCHIVE="sync-erp-api-rollback-drill-${GITHUB_RUN_ID}.tar.gz"
          REMOTE_RUNTIME_ENV="sync-erp-runtime-rollback-drill-${GITHUB_RUN_ID}.env"
          REMOTE_UPLOAD_CLEANUP_COMMAND="rm -f -- \"\$HOME/${REMOTE_API_ARCHIVE}\" \"\$HOME/${REMOTE_RUNTIME_ENV}\""

          for secret_name in \
            GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET \
            SYNC_ERP_AUTH_STATE_SECRET \
            DATABASE_URL; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required staging secret ${secret_name}." >&2
              exit 1
            fi
          done

          case "$DATABASE_URL" in
            *"postgres.ctesbnhcqubamrtcxxqi:"*|*"@db.ctesbnhcqubamrtcxxqi.supabase.co"*) ;;
            *)
              echo "DATABASE_URL does not match the staging Supabase project." >&2
              exit 1
              ;;
          esac

          {
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$(printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" | base64 | tr -d '\n')"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$(printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | base64 | tr -d '\n')"
            printf 'SYNC_ERP_AUTH_STATE_SECRET=%s\n' "$(printf '%s' "$SYNC_ERP_AUTH_STATE_SECRET" | base64 | tr -d '\n')"
            printf 'DATABASE_URL=%s\n' "$(printf '%s' "$DATABASE_URL" | base64 | tr -d '\n')"
          } > "$runtime_env_file"
          chmod 600 "$runtime_env_file"

          # Check the reviewed host key before any transfer or remote mutation.
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" true >/dev/null

          timeout 900 scp "${SCP_OPTS[@]}" \
            "$API_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_API_ARCHIVE}"
          REMOTE_UPLOADS_PRESENT=1
          timeout 900 scp "${SCP_OPTS[@]}" \
            "$runtime_env_file" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_RUNTIME_ENV}"
          REMOTE_UPLOADS_PRESENT=1

          rollback_output="$(
            ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
              "DEPLOY_DIR='apps/api-staging' REMOTE_API_ARCHIVE='${REMOTE_API_ARCHIVE}' REMOTE_RUNTIME_ENV='${REMOTE_RUNTIME_ENV}' PM2_NAME='sync-erp-api-staging' APP_PORT='3001' RUNTIME_ENV='staging' DATABASE_PROJECT_REF='ctesbnhcqubamrtcxxqi' EXPECTED_SHA='${GITHUB_SHA}' ROLLBACK_DRILL_CONFIRMATION='ROLLBACK_STAGING' DRILL_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' API_URL='https://api-staging.santiliving.com/api/trpc' API_BASE_URL='https://api-staging.santiliving.com' WEB_URL='https://sync-erp-staging.santiliving.com' OAUTH_REDIRECT_URL='https://api-staging.santiliving.com/api/auth/google/callback' CORS_ORIGINS='http://localhost:5173,https://sync-erp-staging.santiliving.com,https://sync-erp-git-dev-doncarlo31s-projects.vercel.app' PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH bash -s -- rollback-drill" < scripts/hostinger-api-release.sh
          )"
          printf '%s\n' "$rollback_output"

          read_marker() {
            local marker="$1"
            printf '%s\n' "$rollback_output" | sed -n "s/^${marker}=//p" | tail -n 1
          }

          result="$(read_marker ROLLBACK_DRILL_RESULT)"
          migrations="$(read_marker ROLLBACK_DRILL_MIGRATIONS)"
          new_sha="$(read_marker ROLLBACK_DRILL_NEW_SHA)"
          attempt_path="$(read_marker ROLLBACK_DRILL_ATTEMPT_PATH)"
          previous_sha="$(read_marker ROLLBACK_DRILL_PREVIOUS_SHA)"
          previous_version="$(read_marker ROLLBACK_DRILL_PREVIOUS_VERSION)"
          previous_release="$(read_marker ROLLBACK_DRILL_PREVIOUS_RELEASE)"
          previous_pm2="$(read_marker ROLLBACK_DRILL_PREVIOUS_PM2)"
          previous_port="$(read_marker ROLLBACK_DRILL_PREVIOUS_PORT)"
          previous_pid="$(read_marker ROLLBACK_DRILL_PREVIOUS_PID)"

          [[ "$result" == success ]]
          [[ "$migrations" == skipped ]]
          [[ "$new_sha" == "$GITHUB_SHA" ]]
          [[ "$previous_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$attempt_path" == */releases/.rollback-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} ]]
          [[ "$previous_release" == */apps/api-staging/releases/* || "$previous_release" == */apps/api-staging ]]
          [[ "$previous_pm2" == sync-erp-api-staging ]]
          [[ "$previous_port" == 3001 ]]
          [[ "$previous_pid" =~ ^[0-9]+$ && "$previous_pid" != 0 ]]

          echo "artifact_sha256=${ARTIFACT_SHA256}"
          echo "new_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          echo "attempt_path=${attempt_path}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "previous_version=${previous_version}" >> "$GITHUB_OUTPUT"
          echo "previous_release=${previous_release}" >> "$GITHUB_OUTPUT"
          echo "previous_pm2=${previous_pm2}" >> "$GITHUB_OUTPUT"
          echo "previous_port=${previous_port}" >> "$GITHUB_OUTPUT"
          echo "previous_pid=${previous_pid}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${ARTIFACT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Verify restored release identity and health externally
        env:
          HEALTH_HOST: https://api-staging.santiliving.com
          PREVIOUS_SHA: ${{ steps.rollback.outputs.previous_sha }}
        run: |
          set -euo pipefail
          for path in /health /mcp/health; do
            verified=0
            for attempt in 1 2 3 4 5 6 7 8; do
              if node scripts/verify-release-health.mjs \
                --url "${HEALTH_HOST}${path}" \
                --expected-sha "$PREVIOUS_SHA"; then
                echo "Restored release ${PREVIOUS_SHA} is externally healthy at ${path} (attempt ${attempt}/8)."
                verified=1
                break
              fi
              if [[ "$attempt" -lt 8 ]]; then
                sleep 10
              fi
            done
            if [[ "$verified" -ne 1 ]]; then
              echo "Restored release ${PREVIOUS_SHA} failed external health verification at ${path}." >&2
              exit 1
            fi
          done

          echo "Staging rollback drill completed: previous release ${PREVIOUS_SHA} and release identity were restored; migrations were skipped."
