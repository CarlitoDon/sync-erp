name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sync_erp_test?schema=public
  NODE_ENV: test

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - '.github/workflows/ci.yml'
              - 'apps/api/**'
              - 'apps/mcp/**'
              - 'packages/database/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            web:
              - '.github/workflows/ci.yml'
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'vercel.json'
              - 'apps/web/vercel.json'

  ci:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: npm run db:push --workspace=@sync-erp/database

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy_api:
    name: Deploy API to Hostinger
    needs: [changes, ci]
    if: github.event_name == 'push' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@sync-erp/database

      - name: Build API
        run: npm run build:api

      - name: Prepare deployment package
        run: |
          rm -rf deploy/api-mcp
          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database deploy/api-mcp/prisma
          cp -R apps/api/dist deploy/api-mcp/
          cp apps/api/package.pro.json deploy/api-mcp/package.json
          cp packages/database/prisma/schema.prisma deploy/api-mcp/prisma/
          cp -R packages/database/dist deploy/api-mcp/node_modules/@sync-erp/database/
          cp packages/database/package.json deploy/api-mcp/node_modules/@sync-erp/database/
          if [ -d packages/database/src/generated ]; then
            cp -R packages/database/src/generated deploy/api-mcp/node_modules/@sync-erp/database/
          fi

      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "deploy_dir=apps/api" >> "$GITHUB_OUTPUT"
            echo "health_host=https://api.sync-erp.com" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_dir=apps/api-staging" >> "$GITHUB_OUTPUT"
            echo "health_host=https://api-staging.sync-erp.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 "${{ secrets.HOSTINGER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy package to Hostinger
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          DEPLOY_DIR: ${{ steps.target.outputs.deploy_dir }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          eval $(ssh-agent -a $SSH_AUTH_SOCK)

          echo 'echo "$SSH_PASSPHRASE"' > ~/.ssh/askpass
          chmod +x ~/.ssh/askpass
          export SSH_ASKPASS=~/.ssh/askpass
          export DISPLAY=:0

          ssh-add ~/.ssh/id_ed25519
          SSH_COMMON_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o BatchMode=yes"
          SSH_OPTS="-p 65002 ${SSH_COMMON_OPTS}"
          SCP_OPTS="-P 65002 ${SSH_COMMON_OPTS}"
          API_ARCHIVE="$(mktemp)"
          DB_ARCHIVE="$(mktemp)"
          REMOTE_API_ARCHIVE="sync-erp-api-${GITHUB_SHA}.tar.gz"
          REMOTE_DB_ARCHIVE="sync-erp-database-${GITHUB_SHA}.tar.gz"

          tar -C deploy/api-mcp \
            --exclude='./.htaccess' \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./tmp' \
            --exclude='./stderr.log' \
            -czf "$API_ARCHIVE" .

          timeout 600 scp -C ${SCP_OPTS} \
            "$API_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_API_ARCHIVE}"

          ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "DEPLOY_DIR='${DEPLOY_DIR}' REMOTE_API_ARCHIVE='${REMOTE_API_ARCHIVE}' bash -s" <<'EOF'
            set -euo pipefail
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
            target="$HOME/public_html/${DEPLOY_DIR}"

            mkdir -p "$target"
            find "$target" -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name '.htaccess' \
              ! -name 'node_modules' \
              ! -name 'tmp' \
              ! -name 'stderr.log' \
              -exec rm -rf {} +
            tar -xzf "$HOME/${REMOTE_API_ARCHIVE}" -C "$target"
            rm -f "$HOME/${REMOTE_API_ARCHIVE}"
            cd "$target"

            fingerprint="$(sha256sum package.json | awk '{print $1}')"
            installed_fingerprint=""
            if [ -f .package-deps.sha256 ]; then
              installed_fingerprint="$(cat .package-deps.sha256)"
            fi

            if [ -d node_modules ] && [ -d node_modules/@prisma/client ] && [ -d node_modules/express ] && { [ -z "$installed_fingerprint" ] || [ "$installed_fingerprint" = "$fingerprint" ]; }; then
              echo "Reusing existing production node_modules."
              echo "$fingerprint" > .package-deps.sha256
            else
              echo "Installing production dependencies."
              timeout 600 npm install --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=warn
              echo "$fingerprint" > .package-deps.sha256
            fi

            timeout 180 npm run db:generate
            mkdir -p node_modules/@sync-erp/database tmp
          EOF

          tar -C deploy/api-mcp/node_modules/@sync-erp/database -czf "$DB_ARCHIVE" .

          timeout 600 scp -C ${SCP_OPTS} \
            "$DB_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_DB_ARCHIVE}"

          ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "DEPLOY_DIR='${DEPLOY_DIR}' REMOTE_DB_ARCHIVE='${REMOTE_DB_ARCHIVE}' bash -s" <<'EOF'
            set -euo pipefail
            target="$HOME/public_html/${DEPLOY_DIR}/node_modules/@sync-erp/database"

            mkdir -p "$target"
            find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf "$HOME/${REMOTE_DB_ARCHIVE}" -C "$target"
            rm -f "$HOME/${REMOTE_DB_ARCHIVE}"
          EOF

          rm -f "$API_ARCHIVE" "$DB_ARCHIVE"

          ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "cd ~/public_html/${DEPLOY_DIR} && mkdir -p tmp && touch tmp/restart.txt"

      - name: Verify API health
        env:
          HEALTH_HOST: ${{ steps.target.outputs.health_host }}
        run: |
          for path in /health /mcp/health; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_HOST}${path}" || true)
              if [[ "$code" == "200" ]]; then
                echo "Healthy: ${HEALTH_HOST}${path}"
                break
              fi
              if [[ "$i" == "6" ]]; then
                echo "Health check failed for ${HEALTH_HOST}${path} with HTTP ${code}"
                exit 1
              fi
              sleep 10
            done
          done

  deploy_web:
    name: Deploy Web to Vercel
    needs: [changes, ci]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-web-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      VERCEL_DEPLOY_VIA_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve web deployment mode
        id: web_deploy
        env:
          PROD_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PRODUCTION_WEB }}
          PREVIEW_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_PREVIEW_WEB }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # This repo already uses Vercel's native Git integration for automatic
          # production/preview deployments, so CI should treat that as the
          # default path. Hooks/CLI remain available as an explicit override.
          if [[ "${VERCEL_DEPLOY_VIA_CI}" != "true" ]]; then
            echo "mode=git" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "environment=production" >> "$GITHUB_OUTPUT"
            else
              echo "environment=preview" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            if [[ -n "${PROD_HOOK}" ]]; then
              echo "mode=hook" >> "$GITHUB_OUTPUT"
              echo "hook_url=${PROD_HOOK}" >> "$GITHUB_OUTPUT"
            elif [[ -n "${VERCEL_TOKEN}" ]]; then
              echo "mode=cli" >> "$GITHUB_OUTPUT"
            else
              echo "Missing Vercel deployment credentials for production."
              echo "Set VERCEL_DEPLOY_HOOK_PRODUCTION_WEB or VERCEL_TOKEN."
              exit 1
            fi
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            if [[ -n "${PREVIEW_HOOK}" ]]; then
              echo "mode=hook" >> "$GITHUB_OUTPUT"
              echo "hook_url=${PREVIEW_HOOK}" >> "$GITHUB_OUTPUT"
            elif [[ -n "${VERCEL_TOKEN}" ]]; then
              echo "mode=cli" >> "$GITHUB_OUTPUT"
            else
              echo "Missing Vercel deployment credentials for preview."
              echo "Set VERCEL_DEPLOY_HOOK_PREVIEW_WEB or VERCEL_TOKEN."
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.web_deploy.outputs.mode != 'git'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.web_deploy.outputs.mode != 'git'
        run: npm ci

      - name: Hand off to Vercel Git integration
        if: steps.web_deploy.outputs.mode == 'git'
        run: |
          echo "Web deployment is managed by Vercel Git integration."
          echo "The connected Vercel project will build the current commit automatically."

      - name: Trigger Vercel deploy hook
        id: deploy_hook
        if: steps.web_deploy.outputs.mode == 'hook'
        env:
          HOOK_URL: ${{ steps.web_deploy.outputs.hook_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/vercel-hook.json -w "%{http_code}" -X POST "${HOOK_URL}" || true)
            if [[ "${status}" =~ ^20[0-9]$ ]]; then
              echo "Vercel deploy hook accepted."
              cat /tmp/vercel-hook.json || true
              exit 0
            fi
            if [[ "${status}" == "429" ]]; then
              sleep_time=$(( i * 15 ))
              echo "Vercel deploy hook rate limited. Retry ${i}/5 in ${sleep_time}s..."
              sleep "${sleep_time}"
              continue
            fi
            echo "Vercel deploy hook failed with HTTP ${status}"
            cat /tmp/vercel-hook.json || true
            exit 1
          done
          if [[ -n "${VERCEL_TOKEN}" ]]; then
            echo "Vercel deploy hook kept returning 429 after retries."
            echo "Falling back to Vercel CLI deploy."
            echo "fallback_to_cli=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Vercel deploy hook kept returning 429 after retries and no VERCEL_TOKEN is configured for CLI fallback."
          exit 1

      - name: Install Vercel CLI
        if: steps.web_deploy.outputs.mode == 'cli' || steps.deploy_hook.outputs.fallback_to_cli == 'true'
        run: npm install --global vercel@latest

      - name: Build and deploy web with Vercel CLI
        if: steps.web_deploy.outputs.mode == 'cli' || steps.deploy_hook.outputs.fallback_to_cli == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          run_with_retry() {
            local description="$1"
            shift
            for i in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              sleep_time=$(( i * 20 ))
              echo "${description} failed. Retry ${i}/5 in ${sleep_time}s..."
              sleep "${sleep_time}"
            done
            return 1
          }

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            run_with_retry "vercel pull production" vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
            run_with_retry "vercel build production" vercel build --prod --token="${VERCEL_TOKEN}"
            run_with_retry "vercel deploy production" vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            run_with_retry "vercel pull preview" vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
            run_with_retry "vercel build preview" vercel build --token="${VERCEL_TOKEN}"
            run_with_retry "vercel deploy preview" vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi
