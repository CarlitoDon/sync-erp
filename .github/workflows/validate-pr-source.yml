name: Validate PR Source

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        if: github.head_ref != 'dev' && !startsWith(github.head_ref, 'cto/')
        run: |
          echo "Error: Pull requests to 'main' must come from 'dev' or a 'cto/*' branch."
          echo "Current source branch: ${{ github.head_ref }}"
          exit 1
