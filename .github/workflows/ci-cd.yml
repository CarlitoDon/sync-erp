name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  DATABASE_URL: postgresql://postgres:***@localhost:5432/sync_erp_test?schema=public
  NODE_ENV: test
  TURBO_CACHE: remote:rw
  TURBO_REMOTE_ONLY: "true"
  TURBO_DOWNLOAD_LOCAL_ENABLED: "true"

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - '.github/workflows/ci-cd.yml'
              - 'apps/api/**'
              - 'apps/mcp/**'
              - 'packages/database/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            web:
              - '.github/workflows/ci-cd.yml'
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'vercel.json'
              - 'apps/web/vercel.json'

  ci-api:
    name: Quality Gates (API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: npm run db:push --workspace=@sync-erp/database

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test (integration)
        run: npm run test:integration --workspace=@sync-erp/api
        continue-on-error: false

      - name: Build API
        run: npm run build:api

      - name: Prepare deployment package
        run: |
          rm -rf deploy/api-mcp
          mkdir -p deploy/api-mcp/node_modules/@sync-erp/database deploy/api-mcp/prisma
          cp -R apps/api/dist deploy/api-mcp/
          cp apps/api/package.pro.json deploy/api-mcp/package.json
          cp packages/database/prisma/schema.prisma deploy/api-mcp/prisma/
          cp -R packages/database/dist deploy/api-mcp/node_modules/@sync-erp/database/
          cp packages/database/package.json deploy/api-mcp/node_modules/@sync-erp/database/
          if [ -d packages/database/src/generated ]; then
            cp -R packages/database/src/generated deploy/api-mcp/node_modules/@sync-erp/database/
          fi

          # CRITICAL: Include the generated Prisma client with query engine binary
          # node_modules/.prisma/client/ contains the *.engine.node binary files
          # that must match the target OS (Linux x64 debian-openssl-*)
          if [ -d node_modules/.prisma/client ]; then
            mkdir -p deploy/api-mcp/node_modules/.prisma
            cp -R node_modules/.prisma/client deploy/api-mcp/node_modules/.prisma/
            echo "Included .prisma/client with query engine binary"
          else
            echo "WARNING: .prisma/client/ not found in root node_modules. Checking workspace..."
            if [ -d packages/database/node_modules/.prisma/client ]; then
              mkdir -p deploy/api-mcp/node_modules/.prisma
              cp -R packages/database/node_modules/.prisma/client deploy/api-mcp/node_modules/.prisma/
              echo "Included .prisma/client from workspace node_modules"
            fi
          fi

          # Include @prisma/client and @prisma/adapter-pg JS wrappers
          for pkg in client adapter-pg; do
            if [ -d "node_modules/@prisma/$pkg" ]; then
              mkdir -p "deploy/api-mcp/node_modules/@prisma"
              cp -R "node_modules/@prisma/$pkg" "deploy/api-mcp/node_modules/@prisma/"
              echo "Included @prisma/$pkg"
            fi
          done

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-mcp-build
          path: deploy/api-mcp/
          retention-days: 7

  ci-web:
    name: Quality Gates (Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build Web
        run: npm run build:web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/
          retention-days: 7

  deploy_api:
    name: Deploy API to Hostinger
    needs: [changes, ci-api]
    if: github.event_name == 'push' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-api-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download API build artifact
        uses: actions/download-artifact@v4
        with:
          name: api-mcp-build
          path: deploy/api-mcp/

      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "deploy_dir=apps/api" >> "$GITHUB_OUTPUT"
            echo "health_host=https://api.santiliving.com" >> "$GITHUB_OUTPUT"
            echo "pm2_name=sync-erp-api" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_dir=apps/api-staging" >> "$GITHUB_OUTPUT"
            echo "health_host=https://api-staging.santiliving.com" >> "$GITHUB_OUTPUT"
            echo "pm2_name=sync-erp-api-staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate environment configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEPLOY_DIR: ${{ steps.target.outputs.deploy_dir }}
        run: |
          if [[ -n "$DATABASE_URL" ]]; then
            if [[ "$DEPLOY_DIR" == "apps/api" ]]; then
              PORT=3000
            else
              PORT=3001
            fi
            printf '%%s\n' \
            "DATABASE_URL=\"$DATABASE_URL\"" \
            "JWT_SECRET=\"$JWT_SECRET\"" \
            "PORT=$PORT" \
            "NODE_ENV=production" > deploy/api-mcp/.env.deploy
            echo "Generated .env.deploy from environment secrets"
          else
            echo "No DATABASE_URL secret set; skipping .env.deploy (will keep existing .env on Hostinger)"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 "${{ secrets.HOSTINGER_HOST }}" > ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy package to Hostinger
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          DEPLOY_DIR: ${{ steps.target.outputs.deploy_dir }}
          PM2_NAME: ${{ steps.target.outputs.pm2_name }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          eval $(ssh-agent -a $SSH_AUTH_SOCK)

          echo 'echo "$SSH_PASSPHRASE"' > ~/.ssh/askpass
          chmod +x ~/.ssh/askpass
          export SSH_ASKPASS=~/.ssh/askpass
          export DISPLAY=:0

          ssh-add ~/.ssh/id_ed25519
          SSH_COMMON_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -o BatchMode=yes"
          SSH_OPTS="-p 65002 ${SSH_COMMON_OPTS}"
          SCP_OPTS="-P 65002 ${SSH_COMMON_OPTS}"
          API_ARCHIVE="$(mktemp)"
          REMOTE_API_ARCHIVE="sync-erp-api-${GITHUB_SHA}.tar.gz"

          tar -C deploy/api-mcp \
            --exclude='./.htaccess' \
            --exclude='./.env' \
            --exclude='./tmp' \
            --exclude='./stderr.log' \
            -czf "$API_ARCHIVE" .

          timeout 600 scp -C ${SCP_OPTS} \
            "$API_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_API_ARCHIVE}"

          ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "DEPLOY_DIR='${DEPLOY_DIR}' REMOTE_API_ARCHIVE='${REMOTE_API_ARCHIVE}' PM2_NAME='${PM2_NAME}' bash -s" <<'EOF'
            set -euo pipefail
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
            target="$HOME/public_html/${DEPLOY_DIR}"

            mkdir -p "$target"
            find "$target" -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name '.htaccess' \
              ! -name 'node_modules' \
              ! -name 'tmp' \
              ! -name 'stderr.log' \
              -exec rm -rf {} +
            tar -xzf "$HOME/${REMOTE_API_ARCHIVE}" -C "$target"
            cd "$target"

            # Safely update environment file if a deploy-managed .env.deploy is present
            if [ -f .env.deploy ]; then
              mv .env.deploy .env
              chmod 600 .env
              echo "Updated .env from .env.deploy"
            fi

            fingerprint="$(sha256sum package.json | awk '{print $1}')"
            installed_fingerprint=""
            if [ -f .package-deps.sha256 ]; then
              installed_fingerprint="$(cat .package-deps.sha256)"
            fi

            if [ -d node_modules ] && [ -d node_modules/express ] && { [ -z "$installed_fingerprint" ] || [ "$installed_fingerprint" = "$fingerprint" ]; }; then
              echo "Reusing existing production node_modules."
              echo "$fingerprint" > .package-deps.sha256
            else
              echo "Installing production dependencies."
              timeout 600 npm install --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=warn
              echo "$fingerprint" > .package-deps.sha256
            fi

            # Always override database package from GHA artifact (contains pre-compiled Prisma engine)
            mkdir -p node_modules/@sync-erp
            rm -rf node_modules/@sync-erp/database
            tar -xzf "$HOME/${REMOTE_API_ARCHIVE}" -C "$target" node_modules/@sync-erp/database || true

            # CRITICAL: Override .prisma/client with pre-compiled engine binary from GHA
            # npm install --omit=dev with --ignore-scripts may not generate these correctly
            if tar -tzf "$HOME/${REMOTE_API_ARCHIVE}" 2>/dev/null | grep -q 'node_modules/\.prisma/client/'; then
              echo "Injecting pre-compiled Prisma query engine binary..."
              mkdir -p node_modules/.prisma
              rm -rf node_modules/.prisma/client
              tar -xzf "$HOME/${REMOTE_API_ARCHIVE}" -C "$target" node_modules/.prisma/client 2>/dev/null || true
              echo "✓ Prisma client binary injected successfully."
            else
              echo "⚠ .prisma/client/ not found in archive. Query engine may fall back to platform default."
            fi

            # Override @prisma JS wrapper packages
            for prisma_pkg in client adapter-pg; do
              if tar -tzf "$HOME/${REMOTE_API_ARCHIVE}" 2>/dev/null | grep -q "node_modules/@prisma/${prisma_pkg}/"; then
                mkdir -p "node_modules/@prisma"
                rm -rf "node_modules/@prisma/${prisma_pkg}"
                tar -xzf "$HOME/${REMOTE_API_ARCHIVE}" -C "$target" "node_modules/@prisma/${prisma_pkg}" 2>/dev/null || true
                echo "Overrode @prisma/${prisma_pkg} from built artifact"
              fi
            done

            rm -f "$HOME/${REMOTE_API_ARCHIVE}"
            mkdir -p tmp
          EOF

          rm -f "$API_ARCHIVE"

          ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
                      "set -x && export PATH=/opt/alt/alt-nodejs20/root/usr/bin:\$PATH && echo '--- RESTARTING ---' && ~/node-pm2/node_modules/.bin/pm2 restart '${PM2_NAME}' --update-env 2>&1 || true"

      - name: Verify API health
        env:
          HEALTH_HOST: ${{ steps.target.outputs.health_host }}
        run: |
          MAX_RETRIES=8
          RETRY_DELAYS=(5 10 15 20 30 30 30 30)

          echo "Verifying API health at ${HEALTH_HOST}..."

          check_endpoint() {
            local path="$1"
            local full_url="${HEALTH_HOST}${path}"

            echo "Checking ${full_url} ..."

            for i in $(seq 1 $MAX_RETRIES); do
              idx=$((i - 1))
              local delay="${RETRY_DELAYS[$idx]:-30}"
              local http_code
              local curl_exit_code=0

              http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "${full_url}" 2>&1) || curl_exit_code=$?

              if [[ "$http_code" == "200" ]]; then
                echo "✓ Healthy: ${full_url} (attempt ${i}/${MAX_RETRIES})"
                return 0
              fi

              if [[ "$curl_exit_code" -ne 0 ]]; then
                echo "⚠ Connection error on ${full_url}: curl exit code ${curl_exit_code} (attempt ${i}/${MAX_RETRIES})"
              else
                echo "⚠ HTTP ${http_code} on ${full_url} (attempt ${i}/${MAX_RETRIES})"
              fi

              if [[ "$i" -lt "$MAX_RETRIES" ]]; then
                echo "  Retrying in ${delay}s..."
                sleep "$delay"
              fi
            done

            echo "✗ Health check failed for ${full_url} after ${MAX_RETRIES} attempts"
            return 1
          }

          FAILED=0
          check_endpoint "/health" || FAILED=1
          check_endpoint "/mcp/health" || FAILED=1

          if [[ "$FAILED" -ne 0 ]]; then
            echo "One or more health checks failed."
            exit 1
          fi

          echo "All endpoints healthy."
  deploy_web:
    name: Deploy Web to Vercel
    needs: [changes, ci-web]
    if: github.event_name == 'push' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-web-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build and deploy web with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN}" ]]; then
            echo "Missing VERCEL_TOKEN secret."
            exit 1
          fi

          run_with_retry() {
            local description="$1"
            shift
            for i in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              sleep_time=$(( i * 20 ))
              echo "${description} failed. Retry ${i}/5 in ${sleep_time}s..."
              sleep "${sleep_time}"
            done
            return 1
          }

          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            run_with_retry "vercel pull production" vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
            run_with_retry "vercel build production" vercel build --prod --token="${VERCEL_TOKEN}"
            run_with_retry "vercel deploy production" vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            run_with_retry "vercel pull preview" vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
            run_with_retry "vercel build preview" vercel build --token="${VERCEL_TOKEN}"
            run_with_retry "vercel deploy preview" vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi
