name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      api_deploy_mode:
        description: 'Optional API deployment mode for a manual run'
        required: false
        default: none
        type: choice
        options:
          - none
          - deploy

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sync_erp_test?schema=public
  NODE_ENV: test
  TURBO_CACHE: local:rw

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      bot: ${{ steps.filter.outputs.bot }}
      mcp: ${{ steps.filter.outputs.mcp }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/deploy-coolify.yml'
              - 'apps/api/**'
              - 'packages/database/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            bot:
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/deploy-coolify.yml'
              - 'apps/bot/**'
              - 'packages/database/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            mcp:
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/deploy-coolify.yml'
              - 'apps/mcp/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            web:
              - '.github/workflows/ci-cd.yml'
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'vercel.json'
              - 'apps/web/vercel.json'

  ci-api:
    name: Quality Gates (API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          # Same-deps restore first for Turbo hits; SHA key keeps per-commit freshness.
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      # Always run install. setup-node restores the npm cache but not the
      # full node_modules tree, so npm always (re)links node_modules/.bin.
      # A never-run install on a stale manual node_modules cache left
      # `zod-prisma-types` missing from .bin and broke `prisma generate`
      # during db:generate (run by turbo for lint/typecheck/test/build).
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (unit)
        run: |
          npm run test:unit --workspace=@sync-erp/api
          npm run test --workspace=@sync-erp/mcp

      - name: Test (shared)
        # packages/shared vitest suite. DATABASE_URL must be DEFINED (no
        # connection is opened); it is inherited from the workflow-level env
        # above, which mirrors the localhost test DB service.
        run: npm test --workspace=@sync-erp/shared

      - name: Test release artifact validator
        run: npm run test:release-artifact

      - name: Test release health verifier
        run: npm run test:release-health

      - name: Test Google OAuth redirect verifier
        run: node --test scripts/verify-google-oauth-config.test.mjs

      - name: Test Coolify deploy trigger
        run: bash scripts/trigger-coolify-deploy.test.sh

      - name: Build API
        run: npm run build:api

  ci-api-integration:
    name: Quality Gates (API - Integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          # Same-deps restore first for Turbo hits; SHA key keeps per-commit freshness.
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Setup test database
        run: npm run db:push --workspace=@sync-erp/database

      - name: Build API and dependencies
        run: npm run build:api

      - name: Test (integration)
        run: npm run test:integration --workspace=@sync-erp/api

  ci-web:
    name: Quality Gates (Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          # Same-deps restore first for Turbo hits; SHA key keeps per-commit freshness.
          key: ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      # Always run install — see ci-api job comment.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (web)
        # apps/web vitest suite. Inherits workflow-level DATABASE_URL/NODE_ENV.
        run: npm test --workspace=@sync-erp/web

      - name: Build Web
        run: NODE_ENV=production npm run build:web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/
          retention-days: 7

  # --- Staging Deploys (Immediate on dev push, no waiting for slow gates) ---
  deploy_api_staging:
    name: Deploy API to Coolify (Staging)
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: api
      environment: staging
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_bot_staging:
    name: Deploy Bot to Coolify (Staging)
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.bot == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: bot
      environment: staging
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_mcp_staging:
    name: Deploy MCP to Coolify (Staging)
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: mcp
      environment: staging
      caller_event: ${{ github.event_name }}
    secrets: inherit

  # --- Production Deploys (Gated on main push) ---
  deploy_api_production:
    name: Deploy API to Coolify (Production)
    needs: [changes, ci-api, ci-api-integration]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.api_deploy_mode == 'deploy')
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: api
      environment: production
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_bot_production:
    name: Deploy Bot to Coolify (Production)
    needs: [changes, ci-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.bot == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: bot
      environment: production
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_mcp_production:
    name: Deploy MCP to Coolify (Production)
    needs: [changes, ci-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: mcp
      environment: production
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_web_staging:
    name: Deploy Web to Coolify (Staging)
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: web
      environment: staging
      caller_event: ${{ github.event_name }}
    secrets: inherit

  deploy_web_production:
    name: Deploy Web to Coolify (Production)
    needs: [changes, ci-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      service: web
      environment: production
      caller_event: ${{ github.event_name }}
    secrets: inherit
