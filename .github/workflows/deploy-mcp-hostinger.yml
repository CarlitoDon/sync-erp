name: Deploy MCP to Hostinger

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/deploy-mcp-hostinger.yml'
      - 'apps/mcp/**'
      - 'packages/shared/**'
      - 'scripts/verify-release-health.mjs'
      - 'scripts/write-release-manifest.mjs'
      - 'scripts/hostinger-ssh-pinning.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-mcp-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hostinger-${{ github.ref_name }}
      cancel-in-progress: false
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'main' && 'production') || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build MCP
        run: npm run build --workspace=@sync-erp/mcp

      - name: Prepare deployment package
        run: |
          rm -rf deploy/mcp
          mkdir -p deploy/mcp
          cp -R apps/mcp/dist deploy/mcp/dist
          cp apps/mcp/package.json deploy/mcp/package.json
          RELEASE_VERSION="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("apps/mcp/package.json", "utf8")).version)')"
          node scripts/write-release-manifest.mjs \
            --output deploy/mcp/release.json \
            --service sync-erp-mcp \
            --commit "$GITHUB_SHA" \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID"
          cp scripts/verify-release-health.mjs deploy/mcp/verify-release-health.mjs

          npm install \
            --prefix deploy/mcp \
            --omit=dev \
            --no-audit \
            --no-fund \
            --legacy-peer-deps

          test -f deploy/mcp/node_modules/express/package.json
          test -f deploy/mcp/node_modules/@modelcontextprotocol/sdk/package.json

      - name: Resolve deployment target
        id: target
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" || "${{ inputs.environment }}" == "production" ]]; then
            echo "deploy_dir=apps/mcp" >> "$GITHUB_OUTPUT"
            echo "api_env_dir=apps/api" >> "$GITHUB_OUTPUT"
            echo "pm2_name=sync-erp-mcp" >> "$GITHUB_OUTPUT"
            echo "port=3006" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_dir=apps/mcp-staging" >> "$GITHUB_OUTPUT"
            echo "api_env_dir=apps/api-staging" >> "$GITHUB_OUTPUT"
            echo "pm2_name=sync-erp-mcp-staging" >> "$GITHUB_OUTPUT"
            echo "port=3007" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOSTINGER_SSH_PORT: '65002'
        run: |
          bash scripts/hostinger-ssh-pinning.sh

      - name: Deploy package to Hostinger
        env:
          SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DEPLOY_DIR: ${{ steps.target.outputs.deploy_dir }}
          API_ENV_DIR: ${{ steps.target.outputs.api_env_dir }}
          PM2_NAME: ${{ steps.target.outputs.pm2_name }}
          MCP_PORT: ${{ steps.target.outputs.port }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_SSH_PORT: '65002'
        run: |
          set -euo pipefail
          : "${HOSTINGER_KNOWN_HOSTS_FILE:?Missing Hostinger known-hosts file.}"
          : "${HOSTINGER_SSH_KEY:?Missing Hostinger SSH key.}"
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo 'RUNNER_TEMP must be an absolute directory.' >&2; exit 1 ;;
          esac
          case "$RUNNER_TEMP" in
            *[[:space:][:cntrl:]]*) echo 'RUNNER_TEMP contains whitespace or control characters.' >&2; exit 1 ;;
          esac
          if [ ! -d "$RUNNER_TEMP" ]; then
            echo 'RUNNER_TEMP must be an existing directory.' >&2
            exit 1
          fi
          RUNNER_TEMP_REAL="$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P)"
          case "$RUNNER_TEMP_REAL" in
            *[[:space:][:cntrl:]]*) echo 'resolved RUNNER_TEMP contains whitespace or control characters.' >&2; exit 1 ;;
          esac
          case "$HOSTINGER_KNOWN_HOSTS_FILE" in
            "$RUNNER_TEMP_REAL"/hostinger-known-hosts.*) ;;
            *) echo 'Hostinger known-hosts file is outside the validated RUNNER_TEMP.' >&2; exit 1 ;;
          esac
          if [ ! -f "$HOSTINGER_KNOWN_HOSTS_FILE" ] || [ -L "$HOSTINGER_KNOWN_HOSTS_FILE" ] || [ ! -r "$HOSTINGER_KNOWN_HOSTS_FILE" ]; then
            echo 'Hostinger known-hosts file must be a readable regular file.' >&2
            exit 1
          fi

          SSH_RUNTIME_DIR=""
          SSH_KEY_FILE=""
          SSH_KEY_STAGED_FILE=""
          SSH_ASKPASS_FILE=""
          SSH_ASKPASS_STAGED_FILE=""
          SSH_AGENT_SOCKET=""
          SSH_AGENT_PID=""
          SSH_AGENT_CREATED=0
          SSH_OPTS=()
          SCP_OPTS=()
          SSH_TARGET=""
          MCP_ARCHIVE=""
          REMOTE_MCP_ARCHIVE=""
          REMOTE_UPLOAD_CLEANUP_COMMAND=""
          REMOTE_UPLOADS_PRESENT=0
          cleanup_local() {
            local primary_status="$?"
            trap - EXIT
            if [ "$REMOTE_UPLOADS_PRESENT" -eq 1 ] && [ -n "$REMOTE_UPLOAD_CLEANUP_COMMAND" ]; then
              # Cleanup uses the same pinned SSH options even when deployment
              # failed before the following remote command could start.
              ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "$REMOTE_UPLOAD_CLEANUP_COMMAND" >/dev/null 2>&1 || true
            fi
            if [ "$SSH_AGENT_CREATED" -eq 1 ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi
            for local_file in "$MCP_ARCHIVE" "$SSH_KEY_STAGED_FILE" "$SSH_KEY_FILE" "$SSH_ASKPASS_STAGED_FILE" "$SSH_ASKPASS_FILE" "$SSH_AGENT_SOCKET"; do
              if [ -n "$local_file" ]; then
                rm -f -- "$local_file" || true
              fi
            done
            if [ -n "$SSH_RUNTIME_DIR" ]; then
              rmdir -- "$SSH_RUNTIME_DIR" >/dev/null 2>&1 || true
            fi
            exit "$primary_status"
          }
          trap cleanup_local EXIT

          SSH_RUNTIME_DIR="$(umask 077 && mktemp -d "$RUNNER_TEMP_REAL/sync-erp-hostinger-ssh.XXXXXXXXXX")"
          chmod 700 "$SSH_RUNTIME_DIR"
          case "$SSH_RUNTIME_DIR" in
            "$RUNNER_TEMP_REAL"/sync-erp-hostinger-ssh.*) ;;
            *) echo 'SSH runtime directory was created outside RUNNER_TEMP.' >&2; exit 1 ;;
          esac
          if [ ! -d "$SSH_RUNTIME_DIR" ] || [ -L "$SSH_RUNTIME_DIR" ]; then
            echo 'SSH runtime directory must be a fresh private directory.' >&2
            exit 1
          fi
          SSH_KEY_FILE="$SSH_RUNTIME_DIR/id_ed25519"
          SSH_KEY_STAGED_FILE="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/.id_ed25519.XXXXXXXXXX")"
          case "$SSH_KEY_STAGED_FILE" in
            "$SSH_RUNTIME_DIR"/.id_ed25519.*) ;;
            *) echo 'SSH key staging file was created outside the private runtime directory.' >&2; exit 1 ;;
          esac
          if [ ! -f "$SSH_KEY_STAGED_FILE" ] || [ -L "$SSH_KEY_STAGED_FILE" ] || [ -e "$SSH_KEY_FILE" ] || [ -L "$SSH_KEY_FILE" ]; then
            echo 'SSH key paths must be fresh regular files.' >&2
            exit 1
          fi
          if ! printf '%s\n' "$HOSTINGER_SSH_KEY" |
            bash scripts/hostinger-ssh-pinning.sh \
              --write-atomic-file "$SSH_KEY_STAGED_FILE" "$SSH_KEY_FILE" 600; then
            echo 'Could not write the Hostinger SSH key safely.' >&2
            exit 1
          fi
          if [ ! -f "$SSH_KEY_FILE" ] || [ -L "$SSH_KEY_FILE" ]; then
            echo 'SSH key file was not published as a regular file.' >&2
            exit 1
          fi
          SSH_KEY_STAGED_FILE=""

          SSH_ASKPASS_FILE="$SSH_RUNTIME_DIR/askpass"
          SSH_ASKPASS_STAGED_FILE="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/.askpass.XXXXXXXXXX")"
          case "$SSH_ASKPASS_STAGED_FILE" in
            "$SSH_RUNTIME_DIR"/.askpass.*) ;;
            *) echo 'SSH askpass staging file was created outside the private runtime directory.' >&2; exit 1 ;;
          esac
          if [ ! -f "$SSH_ASKPASS_STAGED_FILE" ] || [ -L "$SSH_ASKPASS_STAGED_FILE" ] || [ -e "$SSH_ASKPASS_FILE" ] || [ -L "$SSH_ASKPASS_FILE" ]; then
            echo 'SSH askpass paths must be fresh regular files.' >&2
            exit 1
          fi
          if ! printf '%s\n' 'printf "%s\\n" "$SSH_PASSPHRASE"' |
            bash scripts/hostinger-ssh-pinning.sh \
              --write-atomic-file "$SSH_ASKPASS_STAGED_FILE" "$SSH_ASKPASS_FILE" 700; then
            echo 'Could not write the SSH askpass helper safely.' >&2
            exit 1
          fi
          if [ ! -f "$SSH_ASKPASS_FILE" ] || [ -L "$SSH_ASKPASS_FILE" ]; then
            echo 'SSH askpass file was not published as a regular file.' >&2
            exit 1
          fi
          SSH_ASKPASS_STAGED_FILE=""
          SSH_AGENT_SOCKET="$SSH_RUNTIME_DIR/agent.sock"
          if [ -e "$SSH_AGENT_SOCKET" ] || [ -L "$SSH_AGENT_SOCKET" ]; then
            echo 'SSH agent socket path unexpectedly pre-existed.' >&2
            exit 1
          fi
          unset SSH_AUTH_SOCK SSH_AGENT_PID
          SSH_AGENT_OUTPUT=""
          if ! SSH_AGENT_OUTPUT="$(ssh-agent -a "$SSH_AGENT_SOCKET")"; then
            echo 'Could not create the SSH agent.' >&2
            exit 1
          fi
          if [ -z "$SSH_AGENT_OUTPUT" ] || ! eval "$SSH_AGENT_OUTPUT"; then
            echo 'Could not initialize the SSH agent.' >&2
            exit 1
          fi
          if [ "${SSH_AUTH_SOCK:-}" != "$SSH_AGENT_SOCKET" ] || [ ! -S "$SSH_AGENT_SOCKET" ]; then
            echo 'SSH agent did not create the expected socket.' >&2
            exit 1
          fi
          case "${SSH_AGENT_PID:-}" in
            ''|*[!0-9]*) echo 'SSH agent did not return a valid PID.' >&2; exit 1 ;;
          esac
          if [ "$SSH_AGENT_PID" -le 0 ] || ! kill -0 "$SSH_AGENT_PID" 2>/dev/null; then
            echo 'SSH agent PID is not running.' >&2
            exit 1
          fi
          SSH_AGENT_CREATED=1
          export SSH_ASKPASS="$SSH_ASKPASS_FILE"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0
          ssh-add "$SSH_KEY_FILE"

          SSH_COMMON_OPTS=(
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${HOSTINGER_KNOWN_HOSTS_FILE}"
            -o GlobalKnownHostsFile=none
            -o HostKeyAlgorithms=ssh-ed25519
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o ConnectTimeout=30
            -o ConnectionAttempts=5
            -o BatchMode=yes
            -o ControlMaster=no
          )
          SSH_OPTS=(-p "$HOSTINGER_SSH_PORT" "${SSH_COMMON_OPTS[@]}")
          SCP_OPTS=(-P "$HOSTINGER_SSH_PORT" "${SSH_COMMON_OPTS[@]}")
          SSH_TARGET="${HOSTINGER_USER}@${HOSTINGER_HOST}"
          MCP_ARCHIVE="$(umask 077 && mktemp "$SSH_RUNTIME_DIR/mcp-archive.XXXXXXXXXX")"
          REMOTE_MCP_ARCHIVE="sync-erp-mcp-${GITHUB_SHA}.tar.gz"
          REMOTE_UPLOAD_CLEANUP_COMMAND="rm -f -- \"\$HOME/${REMOTE_MCP_ARCHIVE}\""

          # Check the reviewed host key before any remote mutation or transfer.
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" true >/dev/null

          # A saturated CloudLinux NPROC quota can prevent even scp from
          # forking. Kill only the exact target using shell builtins, then
          # stop the registered PM2 process so it cannot restart while the
          # package is transferred and extracted. First deployment is allowed
          # to continue when the PM2 namespace does not exist yet.
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
            "PM2_NAME='${PM2_NAME}' bash -s" <<'EOF'
              for pid_file in "$HOME/.pm2/pids/${PM2_NAME}-"*.pid; do
                [ -r "$pid_file" ] || continue
                old_pid=""
                IFS= read -r old_pid < "$pid_file" || true
                case "$old_pid" in
                  ''|*[!0-9]*) continue ;;
                esac
                kill "$old_pid" 2>/dev/null || true
              done

              export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
              export NODE_OPTIONS="--v8-pool-size=1"
              export UV_THREADPOOL_SIZE=1
              pm2="$HOME/node-pm2/node_modules/.bin/pm2"
              if "$pm2" describe "$PM2_NAME" >/dev/null 2>&1; then
                exec "$pm2" stop "$PM2_NAME"
              fi
              echo "PM2 process $PM2_NAME is not registered; continuing with first deployment."
          EOF

          tar -C deploy/mcp \
            --exclude='./.htaccess' \
            --exclude='./.env' \
            --exclude='./tmp' \
            --exclude='./stderr.log' \
            -czf "$MCP_ARCHIVE" .

          timeout 900 scp "${SCP_OPTS[@]}" \
            "$MCP_ARCHIVE" \
            "${HOSTINGER_USER}@${HOSTINGER_HOST}:~/${REMOTE_MCP_ARCHIVE}"
          REMOTE_UPLOADS_PRESENT=1

          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" \
            "DEPLOY_DIR='${DEPLOY_DIR}' API_ENV_DIR='${API_ENV_DIR}' REMOTE_MCP_ARCHIVE='${REMOTE_MCP_ARCHIVE}' PM2_NAME='${PM2_NAME}' MCP_PORT='${MCP_PORT}' EXPECTED_SHA='${GITHUB_SHA}' bash -s" <<'EOF'
            set -euo pipefail
            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH
            target="$HOME/public_html/${DEPLOY_DIR}"
            api_env="$HOME/public_html/${API_ENV_DIR}/.env"
            env_next="$target/.env.next"
            headers_file=""
            initialize_file=""
            tools_file=""
            cleanup_remote_generated_files() {
              local primary_status="$?"
              trap - EXIT
              for generated_file in "$env_next" "$headers_file" "$initialize_file" "$tools_file"; do
                if [ -n "$generated_file" ]; then
                  rm -f -- "$generated_file" || true
                fi
              done
              exit "$primary_status"
            }
            trap cleanup_remote_generated_files EXIT

            mkdir -p "$target"
            find "$target" -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name '.htaccess' \
              ! -name 'tmp' \
              ! -name 'stderr.log' \
              -exec rm -rf {} +
            tar -xzf "$HOME/${REMOTE_MCP_ARCHIVE}" -C "$target"
            cd "$target"

            test -f node_modules/express/package.json
            test -f node_modules/@modelcontextprotocol/sdk/package.json
            rm -f -- "$HOME/${REMOTE_MCP_ARCHIVE}"
            mkdir -p tmp

            bearer_token=""
            if [ -f .env ]; then
              bearer_token="$(sed -n 's/^SYNC_ERP_MCP_BEARER_TOKEN=//p' .env | tail -n 1 | sed 's/^"//;s/"$//')"
            fi
            if [ -z "$bearer_token" ] && [ -f "$api_env" ]; then
              bearer_token="$(sed -n 's/^SYNC_ERP_MCP_BEARER_TOKEN=//p' "$api_env" | tail -n 1 | sed 's/^"//;s/"$//')"
            fi
            if [ -z "$bearer_token" ]; then
              bearer_token="$(openssl rand -hex 32)"
            fi

            umask 077
            if ! (set -C; : > "$env_next") 2>/dev/null; then
              echo 'MCP environment staging path already exists or could not be created.' >&2
              exit 1
            fi
            chmod 600 "$env_next"
            {
              if [ -f .env ]; then
                grep -v -E '^(MCP_PORT|SYNC_ERP_MCP_BEARER_TOKEN)=' .env || true
              fi
              printf 'MCP_PORT=%s\n' "$MCP_PORT"
              printf 'SYNC_ERP_MCP_BEARER_TOKEN=%s\n' "$bearer_token"
            } >> "$env_next"
            mv -f -- "$env_next" .env

            pm2="$HOME/node-pm2/node_modules/.bin/pm2"
            NODE_OPTIONS="--v8-pool-size=1" UV_THREADPOOL_SIZE=1 \
              "$pm2" stop "$PM2_NAME" >/dev/null 2>&1 || true
            sleep 1

            if "$pm2" describe "$PM2_NAME" >/dev/null 2>&1; then
              NODE_OPTIONS="--v8-pool-size=1" UV_THREADPOOL_SIZE=1 \
                MCP_PORT="$MCP_PORT" SYNC_ERP_MCP_BEARER_TOKEN="$bearer_token" \
                "$pm2" restart "$PM2_NAME" --update-env
            else
              NODE_OPTIONS="--v8-pool-size=1" UV_THREADPOOL_SIZE=1 \
                MCP_PORT="$MCP_PORT" SYNC_ERP_MCP_BEARER_TOKEN="$bearer_token" \
                "$pm2" start dist/index.js --name "$PM2_NAME" --time
            fi

            for i in 1 2 3 4 5 6; do
              code="$(curl -sS -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 10 \
                "http://127.0.0.1:${MCP_PORT}/health" || true)"
              if [ "$code" = "200" ]; then
                echo "MCP deployment is healthy on local port ${MCP_PORT}."
                break
              fi
              if [ "$i" = "6" ]; then
                "$pm2" logs "$PM2_NAME" --lines 80 --nostream
                echo "MCP health check failed with HTTP ${code}."
                exit 1
              fi
              sleep 5
            done

            node verify-release-health.mjs \
              --url "http://127.0.0.1:${MCP_PORT}/health" \
              --expected-sha "$EXPECTED_SHA"

            # Staging proves the MCP protocol without invoking a tool. Keep
            # the bearer token and protocol payloads on the host: CI logs only
            # receive the pass/fail result.
            if [ "$DEPLOY_DIR" = "apps/mcp-staging" ]; then
              mcp_url="http://127.0.0.1:${MCP_PORT}/mcp"
              initialize_payload='{"jsonrpc":"2.0","id":"readiness-initialize","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"sync-erp-deploy-readiness","version":"1.0.0"}}}'
              tools_payload='{"jsonrpc":"2.0","id":"readiness-tools-list","method":"tools/list","params":{}}'

              unauthenticated_code="$(curl -sS -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 10 \
                -X POST "$mcp_url" \
                -H 'Content-Type: application/json' \
                --data "$initialize_payload" || true)"
              test "$unauthenticated_code" = "401"

              headers_file="$(mktemp)"
              initialize_file="$(mktemp)"
              tools_file="$(mktemp)"

              initialized_code="$(curl -sS -D "$headers_file" -o "$initialize_file" -w "%{http_code}" \
                --connect-timeout 5 --max-time 15 \
                -X POST "$mcp_url" \
                -H "Authorization: Bearer $bearer_token" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                --data "$initialize_payload")"
              test "$initialized_code" = "200"
              session_id="$(awk 'tolower($1) == "mcp-session-id:" {gsub("\\r", "", $2); print $2; exit}' "$headers_file")"
              test -n "$session_id"
              node -e 'const b=require("node:fs").readFileSync(process.argv[1],"utf8"); const p=b.startsWith("{")?b:b.split(/\r?\n\r?\n/).map(e=>e.split(/\r?\n/).filter(l=>l.startsWith("data:")).map(l=>l.slice(5).trimStart()).join("\n")).filter(Boolean); const r=JSON.parse(Array.isArray(p)?(p.length===1?p[0]:process.exit(1)):p).result; if(r?.protocolVersion!=="2025-03-26"||typeof r?.serverInfo?.name!=="string")process.exit(1)' "$initialize_file"

              tools_code="$(curl -sS -o "$tools_file" -w "%{http_code}" \
                --connect-timeout 5 --max-time 15 \
                -X POST "$mcp_url" \
                -H "Authorization: Bearer $bearer_token" \
                -H "Mcp-Session-Id: $session_id" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' \
                --data "$tools_payload")"
              test "$tools_code" = "200"
              node -e 'const b=require("node:fs").readFileSync(process.argv[1],"utf8"); const p=b.startsWith("{")?b:b.split(/\r?\n\r?\n/).map(e=>e.split(/\r?\n/).filter(l=>l.startsWith("data:")).map(l=>l.slice(5).trimStart()).join("\n")).filter(Boolean); const r=JSON.parse(Array.isArray(p)?(p.length===1?p[0]:process.exit(1)):p).result; if(!Array.isArray(r?.tools))process.exit(1)' "$tools_file"

              closed_code="$(curl -sS -o /dev/null -w "%{http_code}" \
                --connect-timeout 5 --max-time 10 \
                -X DELETE "$mcp_url" \
                -H "Authorization: Bearer $bearer_token" \
                -H "Mcp-Session-Id: $session_id")"
              test "$closed_code" = "200"
              echo 'MCP initialize/tools-list readiness verification passed.'
            fi
            rm -f verify-release-health.mjs
          EOF

          rm -f "$MCP_ARCHIVE"
