name: AI Code Review (9router-tunnel)

on:
  workflow_dispatch:
  # Temporarily disabled — restore automatic AI review with:
  #   pull_request:
  #     types: [opened, synchronize, ready_for_review]
  #     branches: [dev, main]
  # pull_request:
  #   types: [opened, synchronize, ready_for_review]
  #   branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: 🤖 AI Code Review
    runs-on: ubuntu-latest
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tsx
        run: npm install -g tsx

      - name: Run AI Review
        env:
          AI_API_BASE_URL: https://rl3ubev.abc-tunnel.us/v1
          AI_API_KEY: ${{ secrets.NINE_ROUTER_TUNNEL_API_KEY }}
          AI_MODEL: murah-cepat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: tsx scripts/ai-review.ts
